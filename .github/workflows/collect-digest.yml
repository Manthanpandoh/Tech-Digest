name: Daily News Collection & Digest

on:
  schedule:
    # 4:00 AM IST daily = 22:30 UTC previous day
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force digest rebuild even if today already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: techpulse-scheduled-workflows
  cancel-in-progress: false

jobs:
  collect-and-digest:
    name: Collect News & Generate Digest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Authorize Runner IP on MongoDB Atlas
        working-directory: backend
        env:
          ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
          ATLAS_PUBLIC_KEY: ${{ secrets.ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.ATLAS_PRIVATE_KEY }}
        run: |
          python scripts/atlas_ip_manager.py add \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --duration 3600

      - name: Verify Database Connectivity
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          python scripts/atlas_ip_manager.py verify --timeout 10

      - name: Run Collection & Digest Pipeline
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DATABASE_NAME: ${{ vars.DATABASE_NAME || 'techpulse_ai' }}
          USE_MOCK_DB: 'false'
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ vars.OPENROUTER_BASE_URL || 'https://openrouter.ai/api/v1' }}
          MODEL_NAME: ${{ vars.MODEL_NAME || 'google/gemini-2.5-flash' }}
          TIMEZONE: ${{ vars.TIMEZONE || 'Asia/Kolkata' }}
          MAX_ARTICLES_PER_FEED: ${{ vars.MAX_ARTICLES_PER_FEED || '20' }}
          MAX_ARTICLES_TO_ANALYZE: ${{ vars.MAX_ARTICLES_TO_ANALYZE || '50' }}
          TOP_ARTICLES_FOR_DIGEST: ${{ vars.TOP_ARTICLES_FOR_DIGEST || '10' }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: |
          python -m app.scheduler.collect_job

      - name: Revoke Temporary MongoDB Atlas Access
        if: always()
        working-directory: backend
        env:
          ATLAS_PROJECT_ID: ${{ secrets.ATLAS_PROJECT_ID }}
          ATLAS_PUBLIC_KEY: ${{ secrets.ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.ATLAS_PRIVATE_KEY }}
        run: |
          python scripts/atlas_ip_manager.py delete \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}"
